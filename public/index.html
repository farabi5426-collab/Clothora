<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storefront</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-900">

    <!-- Navigation -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <h1 class="text-2xl font-black uppercase tracking-tighter">My Store</h1>
                </div>
                <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                    <a href="#" class="border-b-2 border-blue-500 text-gray-900 inline-flex items-center px-1 pt-1 text-sm font-medium">Home</a>
                    <a href="#" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Shop</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="bg-blue-600 text-white py-16 px-4 text-center">
        <h2 class="text-4xl font-black uppercase tracking-tight mb-4">Latest Collection</h2>
        <p class="text-blue-100 max-w-2xl mx-auto">Discover our premium quality products, fetched in real-time from our database.</p>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        
        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="flex flex-col items-center justify-center py-20">
            <svg class="animate-spin h-10 w-10 text-blue-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-gray-500 font-medium uppercase tracking-widest text-sm">Loading Products...</p>
        </div>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 hidden">
            <!-- Product cards will be injected here by JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <p class="text-gray-500 font-bold uppercase tracking-widest">No products available yet.</p>
        </div>

    </main>

    <!-- Firebase v10 Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ==========================================
        // PASTE YOUR FIREBASE CONFIGURATION HERE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDgGPhYbqdDeIEigXx7YP_n19F8XX0eNMw",
            authDomain: "gen-lang-client-0228474543.firebaseapp.com",
            projectId: "gen-lang-client-0228474543",
            storageBucket: "gen-lang-client-0228474543.firebasestorage.app",
            messagingSenderId: "662231425255",
            appId: "1:662231425255:web:67dd1ac6e4b025ac7a0242"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Phone number for WhatsApp orders (Include country code, e.g., 8801700000000)
        const WHATSAPP_NUMBER = "8801878576650"; 

        async function fetchProducts() {
            const productGrid = document.getElementById('productGrid');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const emptyState = document.getElementById('emptyState');

            try {
                // Fetch products ordered by creation date (newest first)
                const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                loadingIndicator.classList.add('hidden');

                if (querySnapshot.empty) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                productGrid.classList.remove('hidden');

                querySnapshot.forEach((doc) => {
                    const product = doc.data();
                    
                    // Create Card Element
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-lg transition-shadow flex flex-col";
                    
                    // Pre-fill WhatsApp Message
                    const orderMessage = encodeURIComponent(`Hi, I want to order:\n\nProduct: ${product.name}\nPrice: ৳${product.price}\n\nPlease let me know the payment and delivery process for bKash/COD.`);
                    const whatsappLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${orderMessage}`;

                    card.innerHTML = `
                        <div class="aspect-[4/5] bg-gray-100 overflow-hidden relative">
                            <img src="${product.imageUrl}" alt="${product.name}" class="w-full h-full object-cover object-center hover:scale-105 transition-transform duration-500" onerror="this.src='https://via.placeholder.com/400x500?text=No+Image'">
                        </div>
                        <div class="p-5 flex flex-col flex-1">
                            <h3 class="text-lg font-bold text-gray-900 uppercase tracking-tight mb-1 leading-tight">${product.name}</h3>
                            <p class="text-blue-600 font-black text-lg mb-3">৳ ${product.price}</p>
                            <p class="text-gray-500 text-sm mb-6 flex-1 line-clamp-2">${product.description}</p>
                            
                            <a href="${whatsappLink}" target="_blank" rel="noopener noreferrer" class="w-full block text-center bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg uppercase tracking-widest text-xs transition-colors">
                                Order via WhatsApp
                            </a>
                        </div>
                    `;
                    
                    productGrid.appendChild(card);
                });

            } catch (error) {
                console.error("Error fetching products: ", error);
                loadingIndicator.innerHTML = `<p class="text-red-500 font-bold uppercase tracking-widest text-sm">Failed to load products. Check console for details.</p>`;
            }
        }

        // Initialize fetch on page load
        document.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
